<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="./src/assets/SymbolLogo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- A prerendered page's markup is for crawlers and no-JS visitors. With
         JavaScript the app renders afresh (main.jsx), so the snapshot stays
         hidden rather than flashing before the app's own entrance. -->
    <script>document.documentElement.setAttribute('data-js', '');</script>
    <style>[data-js] #root[data-prerendered] { visibility: hidden; }</style>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>أبسط SIYB | تكوين ريادة الأعمال في الجزائر</title>

    <!-- Fallbacks for the few routes that are not prerendered (account and
         admin screens). Every prerendered page carries its own tags, and
         each page's <SEO> replaces the ones marked data-default once the app
         mounts (see main.jsx), so they never appear twice. -->
    <meta data-default name="description" content="برامج أبسط SIYB المعتمدة من المنظمة الدولية للعمل لتكوين ومرافقة رواد الأعمال في الجزائر. ILO-accredited SIYB entrepreneurship training in Algeria." />
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:site_name" content="SIYB" />
    <meta data-default property="og:title" content="أبسط SIYB | تكوين ريادة الأعمال في الجزائر" />
    <meta data-default property="og:image" content="https://syb-now.com/og-image.png" />
    <meta data-default name="twitter:card" content="summary_large_image" />
    <!-- The site-wide schema.org graph (src/lib/site.js) is injected here
         at build time; see vite.config.js. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
