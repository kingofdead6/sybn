<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="">
  <!--
    Neutral stand-in for a network member with no photograph yet. Referenced
    through <img>, so it cannot inherit the app's CSS custom properties; the
    greys below are chosen to sit acceptably on both the light and the dark
    ground, and the shape is drawn on a transparent field so the surface behind
    it shows through.
  -->
